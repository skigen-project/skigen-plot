# Main Branch Pipeline
# ═══════════════════════════════════════════════════════════════════════════
#
# Triggered on pushes to `main` and version tags.
#
# Branch model:  Feature → Staging → Main
# ═══════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (GCC ${{ matrix.gcc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14]
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Eigen
        uses: actions/checkout@v5
        with:
          repository: skigen-project/eigen
          ref: '3.4'
          path: eigen

      - name: Load external dependency versions
        shell: bash
        run: bash scripts/ci/load_external_deps.sh

      - name: Download Qt (mne-cpp pre-built binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qt_binaries -R mne-tools/mne-cpp \
            -p "qt6_${QT_VERSION_TOKEN}_dynamic_binaries_linux.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/qt"
          tar xzf "$RUNNER_TEMP/qt6_${QT_VERSION_TOKEN}_dynamic_binaries_linux.tar.gz" -C "$RUNNER_TEMP/qt"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/qt" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$RUNNER_TEMP/qt/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/qt/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }} \
            -DSKIGENPLOT_BUILD_TESTS=ON \
            -DSKIGENPLOT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-macos:
    name: macOS (AppleClang)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Eigen
        uses: actions/checkout@v5
        with:
          repository: skigen-project/eigen
          ref: '3.4'
          path: eigen

      - name: Load external dependency versions
        shell: bash
        run: bash scripts/ci/load_external_deps.sh

      - name: Download Qt (mne-cpp pre-built binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qt_binaries -R mne-tools/mne-cpp \
            -p "qt6_${QT_VERSION_TOKEN}_dynamic_binaries_macos.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/qt"
          tar xzf "$RUNNER_TEMP/qt6_${QT_VERSION_TOKEN}_dynamic_binaries_macos.tar.gz" -C "$RUNNER_TEMP/qt"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/qt" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$RUNNER_TEMP/qt/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/qt/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -B build \
            -DSKIGENPLOT_BUILD_TESTS=ON \
            -DSKIGENPLOT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Eigen
        uses: actions/checkout@v5
        with:
          repository: skigen-project/eigen
          ref: '3.4'
          path: eigen

      - name: Load external dependency versions
        shell: bash
        run: bash scripts/ci/load_external_deps.sh

      - name: Download Qt (mne-cpp pre-built binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $qtArchive = "qt6_$($env:QT_VERSION_TOKEN)_dynamic_binaries_win.zip"
          gh release download qt_binaries -R mne-tools/mne-cpp `
            -p $qtArchive -D $env:RUNNER_TEMP
          $qtRoot = Join-Path $env:RUNNER_TEMP 'qt'
          New-Item -ItemType Directory -Force -Path $qtRoot | Out-Null
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP $qtArchive) -DestinationPath $qtRoot
          "QT_ROOT_DIR=$qtRoot" >> $env:GITHUB_ENV
          "Qt6_DIR=$qtRoot/lib/cmake/Qt6" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          "$qtRoot/bin" >> $env:GITHUB_PATH

      - name: Configure
        run: |
          cmake -B build `
            -DSKIGENPLOT_BUILD_TESTS=ON `
            -DSKIGENPLOT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  deploy-website:
    name: Deploy Website
    if: github.ref_type != 'tag'
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doc/website/package-lock.json

      - name: Install dependencies
        working-directory: doc/website
        run: npm ci

      - name: Build (production)
        working-directory: doc/website
        env:
          SKIGENPLOT_SITE_ENV: stable
        run: npm run build

      - name: Deploy to skigen-project.github.io/skigen-plot/
        env:
          SKIGEN_PROJECT_PAT: ${{ secrets.SKIGEN_PROJECT_PAT }}
        run: |
          git config --global user.email "deploy@skigen-project.github.io"
          git config --global user.name "skigen-deploy"
          git clone -b main --single-branch "https://${SKIGEN_PROJECT_PAT}@github.com/skigen-project/skigen-project.github.io.git"
          cd skigen-project.github.io

          # Preserve /skigen-plot/dev directory (staging website)
          if [ -d "skigen-plot/dev" ]; then
            cp -r skigen-plot/dev /tmp/skigenplot-dev-backup
          fi

          rm -rf skigen-plot
          mkdir -p skigen-plot
          cp -r ../doc/website/build/. skigen-plot/

          # Restore /skigen-plot/dev directory
          if [ -d "/tmp/skigenplot-dev-backup" ]; then
            cp -r /tmp/skigenplot-dev-backup skigen-plot/dev
          fi

          touch .nojekyll

          git add .
          git commit -m "Deploy skigen-plot website from main@${GITHUB_SHA::8}" --allow-empty
          git push origin main

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Package source distribution
        run: |
          git archive \
            --format=tar.gz \
            --prefix=skigen-plot-${{ steps.version.outputs.VERSION }}/ \
            --output=skigen-plot-${{ steps.version.outputs.VERSION }}.tar.gz \
            HEAD
          sha256sum skigen-plot-${{ steps.version.outputs.VERSION }}.tar.gz \
            > skigen-plot-${{ steps.version.outputs.VERSION }}.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            skigen-plot-${{ steps.version.outputs.VERSION }}.tar.gz
            skigen-plot-${{ steps.version.outputs.VERSION }}.tar.gz.sha256
          generate_release_notes: true
