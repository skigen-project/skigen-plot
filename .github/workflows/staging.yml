# Staging Branch Pipeline
# ═══════════════════════════════════════════════════════════════════════════
#
# Triggered on pushes to `staging`.
#
# Branch model:  Feature → Staging → Main
# ═══════════════════════════════════════════════════════════════════════════

name: Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (GCC ${{ matrix.gcc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libgl1-mesa-dev libvulkan-dev libxkbcommon-dev

      - name: Checkout Eigen
        uses: actions/checkout@v5
        with:
          repository: skigen-project/eigen
          ref: '3.4'
          path: eigen

      - name: Load external dependency versions
        shell: bash
        run: bash scripts/ci/load_external_deps.sh

      - name: Download Qt (mne-cpp pre-built binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qt_binaries -R mne-tools/mne-cpp \
            -p "qt6_${QT_VERSION_TOKEN}_dynamic_binaries_linux.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/qt"
          tar xzf "$RUNNER_TEMP/qt6_${QT_VERSION_TOKEN}_dynamic_binaries_linux.tar.gz" -C "$RUNNER_TEMP/qt"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/qt" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$RUNNER_TEMP/qt/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/qt/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }} \
            -DSKIGENPLOT_BUILD_TESTS=ON \
            -DSKIGENPLOT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: |
          cmake --install build --prefix ${{ runner.temp }}/skigenplot-install

      - name: Test installed package
        run: |
          cmake -S tests/package_consumer -B build-package-consumer \
            -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }} \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/skigenplot-install;$CMAKE_PREFIX_PATH"
          cmake --build build-package-consumer -j$(nproc)
          ./build-package-consumer/skigenplot_package_consumer

  build-macos:
    name: macOS (AppleClang)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Eigen
        uses: actions/checkout@v5
        with:
          repository: skigen-project/eigen
          ref: '3.4'
          path: eigen

      - name: Load external dependency versions
        shell: bash
        run: bash scripts/ci/load_external_deps.sh

      - name: Download Qt (mne-cpp pre-built binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qt_binaries -R mne-tools/mne-cpp \
            -p "qt6_${QT_VERSION_TOKEN}_dynamic_binaries_macos.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/qt"
          tar xzf "$RUNNER_TEMP/qt6_${QT_VERSION_TOKEN}_dynamic_binaries_macos.tar.gz" -C "$RUNNER_TEMP/qt"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/qt" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$RUNNER_TEMP/qt/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/qt/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -B build \
            -DSKIGENPLOT_BUILD_TESTS=ON \
            -DSKIGENPLOT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Eigen
        uses: actions/checkout@v5
        with:
          repository: skigen-project/eigen
          ref: '3.4'
          path: eigen

      - name: Load external dependency versions
        shell: bash
        run: bash scripts/ci/load_external_deps.sh

      - name: Download Qt (mne-cpp pre-built binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $qtArchive = "qt6_$($env:QT_VERSION_TOKEN)_dynamic_binaries_win.zip"
          gh release download qt_binaries -R mne-tools/mne-cpp `
            -p $qtArchive -D $env:RUNNER_TEMP
          $qtRoot = Join-Path $env:RUNNER_TEMP 'qt'
          New-Item -ItemType Directory -Force -Path $qtRoot | Out-Null
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP $qtArchive) -DestinationPath $qtRoot
          "QT_ROOT_DIR=$qtRoot" >> $env:GITHUB_ENV
          "Qt6_DIR=$qtRoot/lib/cmake/Qt6" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          "$qtRoot/bin" >> $env:GITHUB_PATH

      - name: Configure
        run: |
          cmake -B build `
            -DSKIGENPLOT_BUILD_TESTS=ON `
            -DSKIGENPLOT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  deploy-dev-website:
    name: Deploy Dev Website
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      SKIGEN_PROJECT_PAT: ${{ secrets.SKIGEN_PROJECT_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doc/website/package-lock.json

      - name: Install dependencies
        working-directory: doc/website
        run: npm ci

      - name: Build (dev)
        working-directory: doc/website
        env:
          SKIGENPLOT_SITE_ENV: dev
          DOCUSAURUS_BASE_URL: /skigen-plot/dev/
        run: npm run build

      - name: Deploy to skigen-project.github.io/skigen-plot/dev/
        if: env.SKIGEN_PROJECT_PAT != ''
        run: |
          git config --global user.email "deploy@skigen-project.github.io"
          git config --global user.name "skigen-deploy"
          git clone -b main --single-branch "https://${SKIGEN_PROJECT_PAT}@github.com/skigen-project/skigen-project.github.io.git"
          cd skigen-project.github.io

          rm -rf skigen-plot/dev
          mkdir -p skigen-plot/dev
          cp -r ../doc/website/build/. skigen-plot/dev/
          touch .nojekyll

          git add .
          git commit -m "Deploy skigen-plot dev website from staging@${GITHUB_SHA::8}" --allow-empty
          git push origin main

      - name: Report skipped deployment
        if: env.SKIGEN_PROJECT_PAT == ''
        run: echo "::notice::Dev website build passed; deployment skipped because SKIGEN_PROJECT_PAT is not configured."
